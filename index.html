<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Animation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-wrapper">
      <video src="video.mp4" autoplay loop></video>
      <header class="navbar">
        <div class="nav-logo">
          <a href="#">Splain<span>Studio</span></a>
        </div>

        <nav class="nav-links">
          <a href="#" class="nav-link active">Home</a>
          <a href="#" class="nav-link">About</a>
          <a href="#" class="nav-link"
            >Projects<i class="ri-arrow-down-s-line"></i
          ></a>
          <a href="#" class="nav-link">Contact</a>
        </nav>

        <div class="nav-actions">
          <a href="#" class="btn-secondary">Log In</a>
          <a href="#" class="btn-primary">Get Started</a>
        </div>
      </header>

      <main class="hero-section">
        <h1 class="hero-title">Still in Development</h1>
        <p class="hero-subtitle">
          Introducing My Personal<br />
          Hub
        </p>

        <div class="hero-cta">
          <a href="#" class="btn-demo">
            <span class="demo-icon">
              <i class="bx bx-chevron-right"></i>
            </span>
            <span class="demo-text">Hit me up!</span>
          </a>
        </div>

        <div class="hero-footer-wrapper">
          <p class="preorder-tag">Still Learning GSAP with a Project</p>

          <div class="cards-grid">
            <div class="partner-card">
              <i class="bx bx-window-open"></i>
              <span class="card-title">History of<br />Splain</span>
            </div>

            <div class="partner-card">
              <i class="bx bx-window-open"></i>
              <span class="card-title">My Software<br />Projects</span>
            </div>

            <div class="partner-card">
              <i class="bx bx-window-open"></i>
              <span class="card-title">Trying stuffs </br>Out</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="gsap.js"></script>
  </body>
</html>
